name: Mirror impact

# A PR that changes docs/** must update both llms mirrors or say why not, so
# mirror drift is a decision someone made, not an oversight. Re-runs when the
# PR description is edited, because that's where the reason goes. Only reads
# the PR body and the diff; holds no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require both mirrors updated, or a reason
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Template placeholders (<!-- ... -->) don't count as a reason.
          body=$(printf '%s' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs')
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if ! grep -q '^docs/' <<<"$changed"; then echo "No docs/** changes."; exit 0; fi
          missing=()
          grep -qx 'static/llms.txt' <<<"$changed" || missing+=(static/llms.txt)
          grep -qx 'static/llms-full.txt' <<<"$changed" || missing+=(static/llms-full.txt)
          if [ ${#missing[@]} -eq 0 ]; then echo "Both mirrors updated."; exit 0; fi
          if grep -qiE '^\s*-\s*\[x\]\s*No mirror change needed:\s*\S' <<<"$body"; then
            echo "Author says no mirror change is needed."; exit 0
          fi
          echo "::error::This PR changes docs/** but not ${missing[*]}."
          echo "Update both mirrors (AGENTS.md), or tick 'No mirror change needed:' in the PR description and say why (e.g. a typo fix, or a fact only one mirror carries)."
          exit 1
